[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taiyi-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "openai",
  "pydantic",
  "python-dotenv",
  "numpy",
  "tiktoken",
  "qwen-tokenizer",
  "modelscope",
  "transformers",
  "fastapi[standard]>=0.142.2",
  "uvicorn",
  "tavily>=1.1.0",
  "tzdata>=2026.5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["taiyi_agent*"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
