[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taiyi-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "openai",
  "pydantic",
  "python-dotenv"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["taiyi_agent*"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
